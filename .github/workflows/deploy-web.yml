name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支上的新推送会取消旧的构建；main 分支保留正在进行的部署。
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build web release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      # 只在真正发布时配置 Pages：仓库尚未在 Settings → Pages 里启用时，configure-pages 会直接失败。
      # Pull Request 不需要 Pages 配置，base_path 为空时下面的 --base-href 退化为根路径 /，仍可验证构建。
      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      # --base-href 使用仓库的 Pages 根路径（/guitarbook/），子路径部署时资源路径才不会 404。
      # --no-web-resources-cdn 把 CanvasKit 打包进产物，不再依赖 gstatic CDN（网络不可达时应用无法启动）。
      - name: Build web
        run: flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/" --no-web-resources-cdn

      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
